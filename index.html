<style>
  /* ============================================================
     PALETA DE MARCA · Brand Identity Guidelines Dils Lucas Fox
     Primaria : black #202221 · white #FFFFFF · light grey 1 #F9F9FA
                light grey 2 #EAECEE
     Acento   : brass #AE9142, solo para destacar elementos
     Web      : #333138 · #E3D5BC · #D7D1C7 · #FBFAF6
     Los grises de texto (--mid y --soft) se derivan del negro de
     marca porque el manual no define tonos de texto secundario.
     Los colores de estado (--pos, --warn, --neg) tampoco están en el
     manual: son versiones apagadas para convivir con el brass.
     Tipografías: titulares Rufina Bold 700, que es el sustituto de
     Google para IvyMode SemiBold · textos en Nunito Sans.
     ============================================================ */
  :root {
    --ink:#202221; --ink-2:#333138; --brass:#AE9142; --sand:#E3D5BC;
    --line:#D7D1C7; --paper:#FBFAF6; --grey1:#F9F9FA; --grey2:#EAECEE;
    --white:#FFFFFF; --mid:#55524C; --soft:#8C877E; --bg:#FBFAF6;
    --pos:#4F6B4A; --warn:#B08B3E; --neg:#8A3F33;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--ink); font-family:'Nunito Sans',sans-serif; font-size:13px; line-height:1.55; }
  .header { background:var(--ink); padding:22px 48px; display:flex; align-items:center; justify-content:space-between; border-bottom:2px solid var(--brass); }
  .header-logo img { height:22px; width:auto; }
  .header-right { text-align:right; }
  .header-center { display:flex; align-items:center; gap:10px; }
  .office-label { font-size:9px; letter-spacing:0.2em; text-transform:uppercase; color:var(--soft); font-weight:300; }
  .office-select { appearance:none; -webkit-appearance:none; background-color:transparent; border:0.5px solid rgba(255,255,255,0.28); color:var(--white); font-family:inherit; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; padding:7px 32px 7px 14px; cursor:pointer; outline:none; transition:border-color 0.2s;
    background-image:linear-gradient(45deg,transparent 50%,var(--brass) 50%),linear-gradient(135deg,var(--brass) 50%,transparent 50%);
    background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%; background-size:5px 5px,5px 5px; background-repeat:no-repeat; }
  .office-select:hover, .office-select:focus { border-color:var(--brass); }
  .office-select option { background:var(--ink); color:var(--white); text-transform:none; letter-spacing:0; }
  .header-eyebrow { font-size:9px; letter-spacing:0.2em; text-transform:uppercase; color:var(--soft); margin-bottom:3px; font-weight:300; }
  .header-title { font-family:'Rufina',serif; font-size:22px; font-weight:700; color:var(--white); letter-spacing:0.03em; }
  .header-title em { color:var(--brass); font-style:normal; }
  /* REPORT SELECTOR */
  .report-bar { background:var(--ink); padding:0 48px 0; display:flex; gap:8px; align-items:center; border-bottom:0.5px solid rgba(255,255,255,0.1); }
  .report-label { font-size:9px; letter-spacing:0.16em; text-transform:uppercase; color:var(--soft); margin-right:8px; }
  .report-btn { padding:10px 20px; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--soft); cursor:pointer; border:none; background:transparent; border-bottom:2px solid transparent; transition:all 0.2s; font-family:inherit; font-weight:400; }
  .report-btn:hover { color:var(--white); }
  .report-btn.active { color:var(--white); border-bottom-color:var(--brass); font-weight:700; }
  .nav { background:var(--white); border-bottom:0.5px solid var(--line); padding:0 48px; display:flex; }
  .nav-tab { padding:15px 22px; font-size:11px; color:var(--soft); cursor:pointer; border-bottom:2px solid transparent; transition:all 0.2s; letter-spacing:0.08em; text-transform:uppercase; user-select:none; background:transparent; border-top:none; border-left:none; border-right:none; font-family:inherit; }
  .nav-tab:hover { color:var(--ink); }
  .nav-tab.active { color:var(--ink); border-bottom-color:var(--brass); font-weight:600; }
  .main { padding:36px 48px 72px; max-width:1400px; }
  .report { display:none; } .report.active { display:block; }
  .view { display:none; } .view.active { display:block; animation:fadeUp 0.25s ease forwards; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }
  .section-eyebrow { font-size:9px; font-weight:600; letter-spacing:0.2em; text-transform:uppercase; color:var(--brass); margin-bottom:6px; }
  .section-title { font-family:'Rufina',serif; font-size:28px; font-weight:700; color:var(--ink); margin-bottom:4px; }

  .avail-cell { background:var(--ink); padding:18px 22px; }

  .avail-cell.main .avail-val { color:var(--brass); }

  .avail-sub { font-size:10px; color:rgba(255,255,255,0.55); font-weight:300; }
  .avail-cell.main .avail-sub { color:rgba(255,255,255,0.8); }
  .kpi-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); border:1px solid var(--line); margin-bottom:24px; }
  .kpi-grid-3 { display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line); border:1px solid var(--line); margin-bottom:28px; }
  .kpi { background:var(--white); padding:22px 24px; position:relative; }

  .data-table td { padding:9px 10px 9px 0; border-bottom:0.5px solid var(--line); color:var(--mid); font-weight:300; }

  .alert-block { border-left:3px solid var(--brass); background:var(--white); border-top:0.5px solid var(--line); border-right:0.5px solid var(--line); border-bottom:0.5px solid var(--line); padding:16px 20px; margin-bottom:16px; }

  .comm-total span:last-child { color:var(--brass); }
  .split-grid { display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line); border:1px solid var(--line); }

  /* EVOLUTION SUMMARY */

  .evo-to { font-family:'Rufina',serif; font-size:24px; font-weight:700; color:var(--white); }

  .ma-act { flex:1; color:var(--mid); }
  .kt-paid{background:#F1EDE2;color:#4A4636;} .kt-email{background:#EDF0EA;color:#3E5A3A;}
  .kt-social{background:#F3E9E4;color:#7A4A3C;} .kt-portal{background:#F6EFE2;color:#8A6B22;}

  /* KANBAN */

<header class="header" id="app-header"></header>
<div class="report-bar" id="report-bar"></div>
<div id="reports"></div>

<script>
/* ============================================================================
   DLF · INFORMES MENSUALES DE MARKETING
   ----------------------------------------------------------------------------
   COMO ANADIR UN MES NUEVO
   1. Copia el bloque PLANTILLA_MES que esta al final de REPORTS.
   2. Rellena los datos con los exports de Power BI y del Excel de cartera.
   3. Pon el campo oficina que corresponda y activo:true al mes nuevo,
      quitandoselo al mes anterior de esa misma oficina.
   4. Guarda y sube este mismo archivo al repo sobrescribiendo. Nada mas.

   COMO ANADIR UNA OFICINA NUEVA
   1. Anade una linea al bloque OFICINAS con su id, nombre y eyebrow.
   2. Crea sus reports en REPORTS con ese id en el campo oficina.

/* ===== 3. RENDER ==================================================== */
const OPTS = { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}} };
const axisOpts = () => ({
  x:{ ticks:{color:'#8C877E',font:{size:10}}, grid:{display:false}, border:{display:false} },
  y:{ ticks:{color:'#8C877E',font:{size:10}}, grid:{color:'#EAECEE'}, border:{display:false} }
});
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const pick = (o,k) => (o && o[k]) ? o[k] : null;

/* --- piezas reutilizables --- */
function elKpi(k) {
  return `<div class="kpi${k.accent ? ' kpi-accent' : ''}"><p class="kpi-eyebrow">${esc(k.eyebrow)}</p><p class="kpi-val">${esc(k.val)}</p><p class="kpi-sub">${esc(k.sub)}</p></div>`;
}
function elKpiGrid(kpis, cols) {
  const cls = cols === 3 ? 'kpi-grid-3' : 'kpi-grid';
  return `<div class="${cls}">${kpis.map(elKpi).join('')}</div>`;
}
function elSectionHead(eyebrow, titulo, small) {
  const st = small ? ' style="font-size:22px;"' : '';
  return `<div style="margin-bottom:${small ? 16 : 28}px;"><p class="section-eyebrow">${esc(eyebrow)}</p><h2 class="section-title"${st}>${esc(titulo)}</h2><hr class="section-rule"${small ? ' style="margin-bottom:20px;"' : ''}></div>`;
}
function elLeyenda(items, centrada) {
  const st = centrada ? ' style="margin-top:14px;justify-content:center;"' : '';
  return `<div class="legend"${st}>${items.map(i =>
    `<span class="legend-item"><span class="legend-dot" style="background:${i.color};"></span>${esc(i.txt)}</span>`).join('')}</div>`;
}
function elCanal(c) {
  return `<div style="margin-bottom:12px;">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:3px;"><span style="width:10px;height:10px;background:${c.color};"></span><span style="font-size:11px;font-weight:600;">${esc(c.n)}</span></div>
    <div style="display:flex;justify-content:space-between;font-size:10px;color:#8C877E;"><span>${c.leads} leads</span><span>${esc(c.pct)}</span></div>
  </div>`;
}
function elKCard(c) {
  const tags = (c.tags || []).map(t => `<span class="k-tag ${t.c}">${esc(t.l)}</span>`).join('');
  const owners = (c.owners || []).map(ini => {
    const p = OFICINA.equipo.find(e => e.ini === ini) || { color:'ow-sa' };
    return `<span class="k-owner ${p.color}">${esc(ini)}</span>`;
  }).join('');
  const pri = c.pri ? `<span class="k-pri ${c.pri.clase}">${esc(c.pri.l)}</span>` : '';
  const footer = (owners || pri) ? `<div class="k-footer"><div class="k-owners">${owners}</div>${pri}</div>` : '';
  return `<div class="k-card"><p class="k-title">${esc(c.t)}</p>${c.m ? `<p class="k-meta">${esc(c.m)}</p>` : ''}<div class="k-tags">${tags}</div>${footer}</div>`;
}
/* tabla generica: {eyebrow, titulo, headers, filas, total, nota, destacar} */
function elTablaLibre(t) {
  return `<div class="card" style="margin-bottom:16px;"><p class="card-eyebrow">${esc(t.eyebrow)}</p><p class="card-title">${esc(t.titulo)}</p>
    <table class="data-table">
      <thead><tr>${t.headers.map(x => `<th>${esc(x)}</th>`).join('')}</tr></thead>
      <tbody>${t.filas.map(f => `<tr>${f.map((celda, i) => {
        const cls = i === 0 ? 'strong' : (t.destacar === i ? 'figure' : '');
        return `<td${cls ? ` class="${cls}"` : ''}>${esc(celda)}</td>`;
      }).join('')}</tr>`).join('')}
      ${t.total ? `<tr class="total-row">${t.total.map((celda, i) => `<td class="${i === 0 ? 'label' : (t.destacar === i ? 'figure-red' : '')}">${esc(celda)}</td>`).join('')}</tr>` : ''}
      </tbody></table>
    ${t.nota ? `<div class="note-block" style="margin-top:16px;">${esc(t.nota)}</div>` : ''}</div>`;
}
function elEquipo() {
  return `<div class="team-legend">${OFICINA.equipo.map(p =>
    `<span class="tl-item"><span class="tl-owner ${p.color}">${esc(p.ini)}</span> ${esc(p.nombre)}${p.rol ? ' · ' + esc(p.rol) : ''}</span>`).join('')}</div>`;
}

/* --- vista 1: cartera --- */
function vistaCartera(r) {
  const c = r.cartera, id = uid(r);
  let h = elSectionHead('Resumen ejecutivo', 'Cartera | ' + r.periodo);

  if (c.available) {
    h += `<div class="avail-strip">${c.available.map(a =>
      `<div class="avail-cell${a.main ? ' main' : ''}"><p class="avail-eyebrow">${esc(a.eyebrow)}</p><p class="avail-val">${esc(a.val)}</p><p class="avail-sub">${esc(a.sub)}</p></div>`).join('')}</div>`;
  }
  if (c.tipologia) {
    h += `<div class="split-grid" style="margin-bottom:14px;">${c.tipologia.map(b =>
      `<div class="split-cell"><p class="split-label">${esc(b.label)}</p>${b.items.map((it, i) =>
        `<div class="split-item"><span>${esc(it.n)}</span><span class="v">${it.v}</span></div>
         <div class="stat-bar-bg"${i < b.items.length - 1 ? ' style="margin-bottom:10px;"' : ''}><div class="stat-bar" style="width:${it.pct}%;background:${it.color};"></div></div>`).join('')}</div>`).join('')}</div>`;
  }
  if (c.tipologiaNota) h += `<p class="basis-note">${esc(c.tipologiaNota)}</p>`;
  if (c.liveNota) h += `<p class="section-eyebrow" style="margin-bottom:14px;">${esc(c.liveNota)}</p>`;

  /* BLOQUE 1 · las cuatro cifras de cabecera */
  h += elKpiGrid(c.kpis);

  /* fila de distribucion */
  const ms = c.metaScore;
  const msLeyenda = [
    { color:'#4F6B4A', txt:`Verde +80% · ${ms.verde}` },
    { color:'#B08B3E', txt:`Amarillo 60-80% · ${ms.amarillo}` },
    { color:'#AE9142', txt:`Rojo <60% · ${ms.rojo}` }
  ];
  if (ms.sinCalcular) msLeyenda.push({ color:'#D7D1C7', txt:`Sin Meta Score · ${ms.sinCalcular}` });
  /* si todavía no hay datos, el donut se sustituye por un aviso */
  const msHayDatos = (ms.verde + ms.amarillo + ms.rojo + (ms.sinCalcular || 0)) > 0;
  const cardMeta = `<div class="card"><p class="card-eyebrow">Distribución</p><p class="card-title">Meta Score</p>
    ${msHayDatos ? elLeyenda(msLeyenda) + `<div style="position:relative;height:190px;"><canvas id="${id}-metaChart"></canvas></div>`
                 : '<div class="placeholder-box" style="padding:36px;">Pendiente del export de cartera</div>'}
    ${ms.nota ? `<div class="note-block" style="margin-top:14px;">${esc(ms.nota)}</div>` : ''}</div>`;

  /* BLOQUE 2 · calidad de ficha y precio */
  h += elSectionHead('Calidad y precio', 'Cómo está compuesta la cartera live', true);
  if (c.precio) {
    const p = c.precio;
    h += `<div class="grid-2" style="margin-bottom:16px;">${cardMeta}
      <div class="card"><p class="card-eyebrow">Distribución</p><p class="card-title">Rango de precio</p>
      ${elLeyenda(p.labels.map((l, i) => ({ color:p.colores[i], txt:`${l} · ${p.data[i]}` })))}
      <div style="position:relative;height:190px;"><canvas id="${id}-precioChart"></canvas></div></div></div>`;
  } else {
    h += `<div style="margin-bottom:16px;">${cardMeta}</div>`;
  }

  /* BLOQUE 3 · donde esta la cartera */
  if (c.zonas || c.funnel) {
    h += elSectionHead('Distribución', 'Dónde está la cartera y cómo avanza', true);
    const maxZ = c.zonas ? Math.max.apply(null, c.zonas.map(z => z.v)) : 1;
    h += `<div class="grid-2" style="margin-bottom:16px;">
      ${c.zonas ? `<div class="card"><p class="card-eyebrow">Distribución geográfica</p><p class="card-title">Propiedades por zona</p><div style="margin-top:8px;">
        ${c.zonas.map(z => `<div class="zone-row"><span class="zone-name">${esc(z.n)}</span><div class="zone-bar-bg"><div class="zone-bar" style="width:${(z.v / maxZ * 100).toFixed(1)}%;"></div></div><span class="zone-num">${z.v}</span></div>`).join('')}
      </div></div>` : ''}
      ${c.funnel ? `<div class="card"><p class="card-eyebrow">Embudo de conversión</p><p class="card-title">Funnel de cartera</p>
        <div class="funnel-wrap">${c.funnel.pasos.map((p, i) =>
          `<div class="funnel-step fs${i + 1}"><span class="funnel-label">${esc(p.label)}${p.pct ? `<span class="funnel-pct">${esc(p.pct)}</span>` : ''}</span><span class="funnel-val">${p.v}</span></div>`).join('')}</div>
        <p class="source-note" style="margin-top:14px;">${esc(c.funnel.nota)}</p></div>` : ''}
    </div>`;
  }

  /* BLOQUE 4 · valor y comision */
  h += elSectionHead('Valor', 'Comisión potencial de la cartera', true);
  h += elKpiGrid(c.comisionKpis.map(k => Object.assign({ accent:true }, k)), 3);
  const cm = c.comisiones;
  if (cm) {
    h += `<div class="card" style="margin-bottom:16px;"><p class="card-eyebrow">Comisiones</p><p class="card-title">Desglose potencial</p>
      <div class="comm-row"><span>Valor cartera live</span><span>${esc(cm.valor)}</span></div>
      <div class="comm-row"><span>Comisión media ponderada</span><span>${esc(cm.media)}</span></div>
      ${cm.desglose ? `<hr class="comm-divider">${cm.desglose.map(d => `<div class="comm-row"><span>${esc(d.l)}</span><span>${esc(d.v)}</span></div>`).join('')}` : ''}
      <hr class="comm-divider">
      <div class="comm-total"><span>Total potencial</span><span>${esc(cm.total)}</span></div></div>`;
  }

  /* BLOQUE 5 · actividad comercial */
  h += elSectionHead('Actividad', 'Qué se está moviendo y qué no', true);
  const ls = c.leadsSplit, tot = ls.con + ls.sin;
  if (tot > 0) {
    const barras = `<div class="stat-row"><span class="stat-name">Sin leads</span><div class="stat-bar-bg"><div class="stat-bar" style="width:${(ls.sin / tot * 100).toFixed(1)}%;background:var(--neg);"></div></div><span class="stat-num">${ls.sin}</span></div>
      <div class="stat-row"><span class="stat-name">Con leads</span><div class="stat-bar-bg"><div class="stat-bar" style="width:${(ls.con / tot * 100).toFixed(1)}%;background:var(--pos);"></div></div><span class="stat-num">${ls.con}</span></div>`;
    h += `<div class="card" style="margin-bottom:16px;"><p class="card-eyebrow">Actividad</p><p class="card-title">Propiedades con leads vs. sin leads</p>
      <div style="margin-bottom:18px;">${barras}</div>
      ${c.topLeadsChart ? `<div style="position:relative;height:160px;"><canvas id="${id}-leadsBarChart"></canvas></div>` : ''}</div>`;
  }

  if (c.topLeads || c.antiguedad) {
    h += `<div class="grid-2">
      ${c.topLeads ? `<div class="card"><p class="card-eyebrow">Ranking</p><p class="card-title">Top propiedades con leads activos</p>
        <table class="data-table"><thead><tr><th>Ref.</th><th>Precio</th><th>% Com.</th><th>Enq.</th><th>Días</th><th>Meta</th></tr></thead><tbody>
        ${c.topLeads.map(t => `<tr><td>${esc(t.ref)}</td><td>${esc(t.precio)}</td><td>${esc(t.com)}</td><td>${t.enq}</td><td>${t.dias}</td><td><span class="badge ${t.metaClase}">${esc(t.meta)}</span></td></tr>`).join('')}
        </tbody></table></div>` : ''}
      ${c.antiguedad ? `<div class="card"><p class="card-eyebrow">Antigüedad</p><p class="card-title">${esc(c.antiguedad.titulo || 'Más tiempo en mercado')}</p><div style="position:relative;height:${c.antiguedad.alto || 140}px;"><canvas id="${id}-oldChart"></canvas></div>${c.antiguedad.nota ? `<div class="note-block" style="margin-top:14px;">${esc(c.antiguedad.nota)}</div>` : ''}</div>` : ''}
    </div>`;
  }
  if (c.alertas) {
    h += `<div class="alert-block" style="margin-top:16px;"><p class="alert-eyebrow">${esc(c.alertas.titulo)}</p>
      ${c.alertas.filas.map(f => `<div class="alert-row"><span>${esc(f.txt)}</span><span class="badge b-dred">${esc(f.badge)}</span></div>`).join('')}</div>`;
  }

  /* ofertas */
  if (c.ofertas) {
    const o = c.ofertas;
    h += `<div class="card" style="margin-bottom:16px;"><p class="card-eyebrow">Pipeline comercial</p><p class="card-title">${esc(o.titulo)}</p>
      <table class="data-table">
        <thead><tr><th>Cliente</th><th>Referencia</th><th>Tipo</th><th>Precio oferta</th><th>% Com.</th><th>Comisión</th><th>Cierre est.</th><th>Estado</th></tr></thead>
        <tbody>${o.filas.map(f => `<tr><td class="strong">${esc(f.cliente)}</td><td>${esc(f.ref)}</td><td>${esc(f.tipo)}</td><td>${esc(f.precio)}</td><td>${esc(f.com)}</td><td>${esc(f.comision)}</td><td>${esc(f.cierre)}</td><td><span class="offer-stage ${f.clase}">${esc(f.estado)}</span></td></tr>`).join('')}
        <tr class="total-row"><td class="label">${esc(o.total.label)}</td><td></td><td></td><td class="figure">${esc(o.total.precio)}</td><td></td><td class="figure-red">${esc(o.total.comision)}</td><td></td><td></td></tr>
        </tbody></table>
      <p class="source-note">Iniciales del cliente por privacidad. El detalle nominal está en Power BI.</p></div>`;
  }

  if (c.baseNota) h += `<p class="basis-note" style="margin-bottom:0;">${esc(c.baseNota)}</p>`;

  (c.secciones || []).forEach(s => { h += elSeccion(s); });

  /* evolucion o contexto */
  if (c.evolucion) {
    const e = c.evolucion;
    h += `<div class="evo-block"><p class="evo-eyebrow">Comparativa</p><p class="evo-title">${esc(e.titulo)}</p>
      <div class="evo-grid">${e.metricas.map(m =>
        `<div class="evo-metric"><p class="evo-metric-label">${esc(m.label)}</p><div class="evo-metric-vals"><span class="evo-from">${esc(m.de)}</span><span class="evo-arrow">→</span><span class="evo-to">${esc(m.a)}</span><span class="evo-delta evo-${m.dir}">${esc(m.delta)}</span></div></div>`).join('')}</div>
      <div class="evo-narrative">${e.narrativa.map(p => `<p>${p}</p>`).join('')}</div></div>`;
  } else if (c.contexto) {
    h += `<div class="evo-block" style="margin-top:16px;"><p class="evo-eyebrow">${esc(c.contexto.eyebrow)}</p><p class="evo-title">${esc(c.contexto.titulo)}</p>
      <div class="evo-narrative">${c.contexto.narrativa.map(p => `<p>${p}</p>`).join('')}</div></div>`;
  }
  return h;
}

/* --- vista 2: leads --- */
function vistaLeads(r) {
  const l = r.leads, id = uid(r);
  let h = elSectionHead('Performance', 'Análisis de Leads | ' + r.periodo);
  h += `<div class="kpi-grid" style="margin-bottom:28px;">${l.kpis.map(elKpi).join('')}</div>`;
  h += `<div class="card" style="margin-bottom:16px;"><p class="card-eyebrow">Evolución mensual</p><p class="card-title">Enquiries por mes · 2026</p>
    <div style="position:relative;height:280px;"><canvas id="${id}-monthlyChart"></canvas></div>
    <p class="source-note">Fuente: ${esc(r.fuente)}</p></div>`;

  const donut = (canvasId, datos, nota) => `<div style="display:flex;align-items:center;gap:24px;">
      <div style="position:relative;height:200px;flex:0 0 200px;"><canvas id="${canvasId}"></canvas></div>
      <div style="flex:1;">${datos.map(elCanal).join('')}${nota ? `<div class="note-block" style="margin-top:16px;">${esc(nota)}</div>` : ''}</div></div>`;

  if (l.groupPathLeyendaCorta) {
    h += `<div class="grid-2">
      <div class="card"><p class="card-eyebrow">Canal</p><p class="card-title">Group Marketing Path</p>
        <div style="position:relative;height:190px;"><canvas id="${id}-groupChart"></canvas></div>
        ${elLeyenda(l.groupPath.slice(0, 3).map(g => ({ color:g.color, txt:`${g.n === 'LF Website' ? 'LF Web' : g.n === 'International Portal' ? 'Int.' : g.n} ${g.pct}` })), true)}</div>
      <div class="card"><p class="card-eyebrow">LF Website</p><p class="card-title">Marketing Path</p>
        <div style="position:relative;height:190px;"><canvas id="${id}-mktChart"></canvas></div>
        ${elLeyenda(l.webPath.map(w => ({ color:w.color, txt:`${w.n === 'Organic & Direct' ? 'Organic' : w.n} ${w.pct}` })), true)}</div>
    </div>`;
  } else {
    h += `<div class="grid-2" style="margin-bottom:16px;">
      <div class="card"><p class="card-eyebrow">Distribución de canal</p><p class="card-title">Group Marketing Path</p>
        ${donut(id + '-groupChart', l.groupPath)}<p class="source-note">Fuente: ${esc(r.fuente)}</p></div>
      <div class="card"><p class="card-eyebrow">LF Website · desglose</p><p class="card-title">Marketing Path</p>
        ${donut(id + '-mktChart', l.webPath, l.webPathNota)}<p class="source-note">Fuente: ${esc(r.fuente)}</p></div>
    </div>`;
  }

  if (l.campanas) {
    const cp = l.campanas, tot = cp.filas.reduce((s, c) => s + c.leads, 0);
    const col = { 'Activa':['#EDF0EA','#4F6B4A'], 'Pausada':['#F6EFE2','#8A6B22'], 'Finalizada':['#EFEDE6','#55524C'] };
    h += `<div class="card" style="margin-bottom:16px;"><p class="card-eyebrow">Paid Media · desglose</p><p class="card-title">${esc(cp.titulo)}</p>
      <table class="data-table"><thead><tr><th>Campaña</th><th>Canal</th><th>Leads</th><th>% sobre paid</th><th>Periodo</th><th>Estado</th></tr></thead><tbody>
      ${cp.filas.map(c => {
        const e = col[c.estado] || col['Finalizada'];
        return `<tr><td class="strong">${esc(c.name)}</td>
          <td><span style="font-size:9px;font-weight:700;padding:2px 6px;background:#F1EDE2;color:#4A4636;letter-spacing:0.06em;text-transform:uppercase;">${esc(c.canal)}</span></td>
          <td class="figure">${c.leads}</td><td>${tot > 0 ? (c.leads / tot * 100).toFixed(1) : 0}%</td><td>${esc(c.periodo)}</td>
          <td><span style="font-size:9px;font-weight:600;padding:2px 7px;background:${e[0]};color:${e[1]};">${esc(c.estado)}</span></td></tr>`;
      }).join('')}
      <tr class="total-row"><td class="label">Total</td><td></td><td class="figure-red">${tot}</td><td></td><td></td><td></td></tr>
      </tbody></table>
      ${cp.nota ? `<div class="note-block" style="margin-top:16px;">${esc(cp.nota)}</div>` : ''}</div>`;
  }

  (l.secciones || []).forEach(s => {
    h += elSectionHead(s.eyebrow, s.titulo, true);
    if (s.kpis) h += elKpiGrid(s.kpis);
    (s.tablas || []).forEach(t => { h += elTablaLibre(t); });
    if (s.nota) h += `<div class="note-block" style="margin-bottom:16px;">${esc(s.nota)}</div>`;
  });
  return h;
}

/* --- vista 3: acciones --- */
function elSeccion(s) {
  let h = elSectionHead(s.eyebrow, s.titulo, true);
  if (s.kpis) h += elKpiGrid(s.kpis);
  (s.tablas || []).forEach(t => { h += elTablaLibre(t); });
  if (s.nota) h += `<div class="note-block" style="margin-bottom:16px;">${esc(s.nota)}</div>`;
  return h;
}
function vistaAcciones(r) {
  const a = r.acciones, id = uid(r);
  let h = '';

  /* secciones marcadas como 'antes' abren la pestaña */
  (a.secciones || []).filter(s => s.antes).forEach(s => { h += elSeccion(s); });

  /* el bloque de paid se construye aparte y se coloca despues de las acciones */
  let paidHtml = '';
  if (a.paid) {
    const g = a.paid.google, m = a.paid.meta;
    paidHtml += elSectionHead('Performance Paid Media', a.paid.titulo, true);
    paidHtml += `<p class="section-eyebrow" style="margin-bottom:14px;">${esc(g.titulo)}</p>`;
    paidHtml += elKpiGrid(g.kpis);
    paidHtml += `<div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);">${g.kpis2.map(elKpi).join('')}</div>`;

    const cardGoogle = `<div class="card"><p class="card-eyebrow">Google Ads</p><p class="card-title">${esc(g.chartTitulo || 'Leads por tipo de campaña')}</p>
        <div style="position:relative;height:200px;"><canvas id="${id}-googleChart"></canvas></div>
        ${g.nota ? `<div class="note-block" style="margin-top:16px;">${esc(g.nota)}</div>` : ''}</div>`;

    /* la columna de inversion solo sale si los datos la traen */
    const mInv = m && m.filas.some(f => f.inv);
    const cardMeta = m ? `<div class="card"><p class="card-eyebrow">Meta Ads</p><p class="card-title">${esc(m.titulo)}</p>
        <table class="data-table" style="margin-top:8px;">
          <thead><tr><th>Campaña</th><th>Resultados</th>${mInv ? '<th>Inversión</th>' : ''}<th>Impresiones</th><th>CTR</th></tr></thead>
          <tbody>${m.filas.map(f => `<tr><td class="strong">${esc(f.name)}</td><td style="font-family:'Rufina',serif;font-weight:700;font-size:16px;color:${f.resColor};">${f.res}</td>${mInv ? `<td>${esc(f.inv)}</td>` : ''}<td>${esc(f.imp)}</td><td>${esc(f.ctr)}</td></tr>`).join('')}
          <tr class="total-row"><td class="label">Total</td><td class="figure-red">${m.total.res}</td>${mInv ? `<td>${esc(m.total.inv)}</td>` : ''}<td>${esc(m.total.imp)}</td><td>${esc(m.total.ctr)}</td></tr>
          </tbody></table>
        ${m.nota ? `<div class="note-block" style="margin-top:16px;">${esc(m.nota)}</div>` : ''}</div>` : '';

    paidHtml += m ? `<div class="grid-2" style="margin-bottom:16px;">${cardGoogle}${cardMeta}</div>`
                  : `<div style="margin-bottom:16px;">${cardGoogle}</div>`;

    (a.paid.tablas || []).forEach(t => { paidHtml += elTablaLibre(t); });
  }


  if (a.kanban) {
    h += elSectionHead('Plan de acción', 'Acciones de Marketing | ' + r.periodo);
    /* la leyenda se construye con las columnas que realmente tiene el mes */
    const colColor = { 'col-coming':'#8C877E', 'col-todo':'#B08B3E', 'col-doing':'#55524C', 'col-done':'#4F6B4A', 'col-discuss':'#AE9142' };
    h += `<div class="k-legend">${a.kanban.map(col =>
      `<span class="kl-item"><span class="kl-dot" style="background:${colColor[col.clase] || '#8C877E'};"></span>${esc(col.estado)}</span>`).join('')}</div>`;
    h += `<div class="board">${a.kanban.map(col =>
      `<div class="col ${col.clase}"><div class="col-head"><span class="col-name">${esc(col.estado)}</span><span class="col-cnt">${col.cards.length}</span></div>
       <div class="col-body">${col.cards.map(elKCard).join('')}</div></div>`).join('')}</div>`;
  }

  if (a.destacado || a.realizadas) {
    h += `<div style="margin-bottom:16px;margin-top:32px;"><p class="section-eyebrow">Plan de acción</p><h2 class="section-title" style="font-size:22px;">${esc(a.destacadoTitulo || (a.realizadas ? a.realizadas.titulo : 'Acciones realizadas'))}</h2><hr class="section-rule" style="margin-bottom:20px;"></div>`;
  }
  if (a.destacado) {
    const d = a.destacado;
    h += `<div class="alert-block" style="border-left-color:#4F6B4A;margin-bottom:24px;">
      <p class="alert-eyebrow" style="color:#4F6B4A;">${esc(d.eyebrow)}</p>
      <p style="font-size:13px;color:var(--ink);font-weight:600;margin-bottom:12px;">${esc(d.titulo)}</p>
      <div class="check-grid">${d.items.map(i =>
        `<div class="check-item"><span class="check-mark">&#10003;</span><span class="check-text"><strong>${esc(i.b)}</strong>${esc(i.t)}</span></div>`).join('')}</div></div>`;
  }
  if (a.realizadas) {
    h += `<div class="board" style="margin-bottom:32px;">
      <div class="col col-done col-wide"><div class="col-head"><span class="col-name">${esc(a.realizadas.titulo)}</span><span class="col-cnt">${a.realizadas.cards.length}</span></div>
      <div class="col-body">${a.realizadas.cards.map(elKCard).join('')}</div></div></div>`;
    h += elEquipo();
  }

  /* tableros: varios kanban con titulo propio, para separar general de local */
  (a.tableros || []).forEach(tb => {
    h += elSectionHead(tb.eyebrow, tb.titulo, true);
    const colColor = { 'col-coming':'#8C877E', 'col-todo':'#B08B3E', 'col-doing':'#55524C', 'col-done':'#4F6B4A', 'col-discuss':'#AE9142' };
    h += `<div class="k-legend">${tb.columnas.map(col =>
      `<span class="kl-item"><span class="kl-dot" style="background:${colColor[col.clase] || '#8C877E'};"></span>${esc(col.estado)}</span>`).join('')}</div>`;
    h += `<div class="board" style="margin-bottom:28px;">${tb.columnas.map(col =>
      `<div class="col ${col.clase}"><div class="col-head"><span class="col-name">${esc(col.estado)}</span><span class="col-cnt">${col.cards.length}</span></div>
       <div class="col-body">${col.cards.map(elKCard).join('')}</div></div>`).join('')}</div>`;
  });

  if (a.marketingActions && a.marketingActions.length) {
    const props = a.marketingActions;
    const nAcc = props.reduce((s, p) => s + p.acc.length, 0);
    h += `<div style="margin-bottom:16px;margin-top:32px;"><p class="section-eyebrow">Detalle operativo</p><h2 class="section-title" style="font-size:22px;">Marketing Actions por Propiedad</h2><hr class="section-rule" style="margin-bottom:20px;"></div>
      <div class="ma-controls">
        <input class="ma-search" id="${id}-ma-search" type="text" placeholder="Buscar por referencia..." data-ma="${id}">
        <span class="ma-count" id="${id}-ma-count">${props.length} propiedades · ${nAcc} acciones</span>
      </div>
      <div id="${id}-ma-list">${props.map(p => {
        const done = p.acc.filter(x => x.s === 'Completada').length;
        return `<div class="ma-prop"><div class="ma-prop-head"><span class="ma-ref">${esc(p.ref)}</span><span class="ma-summary">${p.acc.length} acciones · ${done} completadas · ${p.acc.length - done} activas</span><span class="ma-chevron">&#9662;</span></div>
          <div class="ma-actions">${p.acc.map(x =>
            `<div class="ma-action"><span class="ma-date">${esc(x.d)}</span><span class="ma-ch ${x.c}">${esc(x.ch)}</span><span class="ma-act">${esc(x.a)}</span><span class="badge ${x.s === 'Completada' ? 'b-green' : 'b-amber'}">${esc(x.s)}</span></div>`).join('')}</div></div>`;
      }).join('')}</div>`;
  }

  h += paidHtml;

  (a.secciones || []).filter(s => !s.antes).forEach(s => { h += elSeccion(s); });

  if (!h) return `<div class="placeholder-box">${esc(a.pendiente || 'Sin acciones registradas en este periodo.')}</div>`;
  if (a.pendiente) h += `<p class="basis-note" style="margin-top:24px;margin-bottom:0;">${esc(a.pendiente)}</p>`;
  return h;
}

/* --- montaje --- */
const TABS = [
  { k:'cartera', l:'Cartera & Datos', fn:vistaCartera },
  { k:'leads', l:'Análisis de Leads', fn:vistaLeads },
  { k:'acciones', l:'Acciones de Marketing', fn:vistaAcciones }
];
const pintado = {};
const uid = r => r.oficina + '-' + r.id;
const getReport = u => REPORTS.find(r => uid(r) === u);
let oficinaActiva = (REPORTS.find(r => r.activo) || REPORTS[REPORTS.length - 1]).oficina;

function montar() {
  document.title = OFICINA.tituloPagina;
  const of = OFICINAS.find(o => o.id === oficinaActiva) || OFICINAS[0];

  document.getElementById('app-header').innerHTML =
    `<div class="header-logo"><img src="${OFICINA.logo}" alt="Dils Lucas Fox"></div>
     <div class="header-center">
       <label class="office-label" for="office-select">Oficina</label>
       <select class="office-select" id="office-select">${OFICINAS.map(o =>
         `<option value="${o.id}"${o.id === oficinaActiva ? ' selected' : ''}>${esc(o.nombre)}</option>`).join('')}</select>
     </div>
     <div class="header-right"><p class="header-eyebrow">${esc(of.eyebrow)}</p><h1 class="header-title">${OFICINA.titulo}</h1></div>`;

  document.getElementById('office-select').addEventListener('change', e => irAOficina(e.target.value));
  pintarOficina();

  document.getElementById('report-bar').addEventListener('click', e => {
    const b = e.target.closest('.report-btn'); if (!b) return;
    irAReport(b.dataset.rep);
  });
  document.getElementById('reports').addEventListener('click', e => {
    const t = e.target.closest('.nav-tab');
    if (t) { irATab(t.dataset.rep, t.dataset.tab); return; }
    const p = e.target.closest('.ma-prop-head');
    if (p) p.parentElement.classList.toggle('open');
  });
  document.getElementById('reports').addEventListener('input', e => {
    if (e.target.classList.contains('ma-search')) filtrarMA(e.target.dataset.ma);
  });
}

/* dibuja la barra de reports y las vistas de la oficina activa */
function pintarOficina() {
  const lista = REPORTS.filter(r => r.oficina === oficinaActiva);
  if (!lista.length) {
    document.getElementById('report-bar').innerHTML = '';
    document.getElementById('reports').innerHTML = '<main class="main"><div class="placeholder-box">Todavía no hay reports cargados para esta oficina.</div></main>';
    return;
  }
  const activo = uid(lista.find(r => r.activo) || lista[lista.length - 1]);

  document.getElementById('report-bar').innerHTML =
    `<span class="report-label">Report</span>` + lista.map(r =>
      `<button class="report-btn${uid(r) === activo ? ' active' : ''}" data-rep="${uid(r)}">${esc(r.label)}</button>`).join('');

  document.getElementById('reports').innerHTML = lista.map(r =>
    `<div class="report${uid(r) === activo ? ' active' : ''}" id="report-${uid(r)}">
      <nav class="nav">${TABS.map((t, i) =>
        `<button class="nav-tab${i === 0 ? ' active' : ''}" data-rep="${uid(r)}" data-tab="${t.k}">${esc(t.l)}</button>`).join('')}</nav>
      <main class="main">${TABS.map((t, i) =>
        `<div class="view${i === 0 ? ' active' : ''}" id="${uid(r)}-${t.k}">${t.fn(r)}</div>`).join('')}</main>
    </div>`).join('');

  irAReport(activo);
}

function irAOficina(oid) {
  oficinaActiva = oid;
  Object.keys(pintado).forEach(k => delete pintado[k]);
  const of = OFICINAS.find(o => o.id === oid) || OFICINAS[0];
  const eb = document.querySelector('.header-eyebrow');
  if (eb) eb.textContent = of.eyebrow;
  pintarOficina();
  window.scrollTo(0, 0);
}

function irAReport(id) {
  document.querySelectorAll('.report-btn').forEach(b => b.classList.toggle('active', b.dataset.rep === id));
  document.querySelectorAll('.report').forEach(r => r.classList.toggle('active', r.id === 'report-' + id));
  irATab(id, 'cartera');
}

function irATab(id, tab) {
  document.querySelectorAll('#report-' + id + ' .nav-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.querySelectorAll('#report-' + id + ' .view').forEach(v => v.classList.toggle('active', v.id === id + '-' + tab));
  pintarCharts(id, tab);
}

function filtrarMA(id) {
  const q = document.getElementById(id + '-ma-search').value.toUpperCase();
  const rep = getReport(id);
  let props = 0, accs = 0;
  document.querySelectorAll('#' + id + '-ma-list .ma-prop').forEach((p, i) => {
    const ok = p.querySelector('.ma-ref').textContent.toUpperCase().includes(q);
    p.style.display = ok ? '' : 'none';
    if (ok) { props++; accs += rep.acciones.marketingActions[i].acc.length; }
  });
  document.getElementById(id + '-ma-count').textContent = props + ' propiedades · ' + accs + ' acciones';
}

/* --- charts --- */
function pintarCharts(id, tab) {
  const clave = id + ':' + tab;
  if (pintado[clave] || typeof Chart === 'undefined') return;
  pintado[clave] = true;
  const r = getReport(id);
  const donut = (canvasId, labels, data, colors, sufijo) => {
    const el = document.getElementById(canvasId); if (!el) return;
    new Chart(el, {
      type:'doughnut',
      data:{ labels, datasets:[{ data, backgroundColor:colors, borderWidth:0 }] },
      options:{ responsive:true, maintainAspectRatio:false, cutout:'65%', plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:c => ' ' + c.label + ': ' + c.raw + ' ' + sufijo } } } }
    });
  };

  if (tab === 'cartera') {
    const c = r.cartera;
    const elMeta = document.getElementById(id + '-metaChart');
    if (elMeta) {
      const msLab = ['Verde','Amarillo','Rojo'], msDat = [c.metaScore.verde, c.metaScore.amarillo, c.metaScore.rojo], msCol = ['#4F6B4A','#B08B3E','#AE9142'];
      if (c.metaScore.sinCalcular) { msLab.push('Sin Meta Score'); msDat.push(c.metaScore.sinCalcular); msCol.push('#D7D1C7'); }
      new Chart(elMeta, {
        type:'doughnut',
        data:{ labels:msLab, datasets:[{ data:msDat, backgroundColor:msCol, borderWidth:0 }] },
        options:{ ...OPTS, cutout:'68%', plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:x => ' ' + x.label + ': ' + x.raw + ' props.' } } } }
      });
    }
    if (c.precio) {
      const el = document.getElementById(id + '-precioChart');
      if (el) new Chart(el, {
        type:'doughnut',
        data:{ labels:c.precio.labels, datasets:[{ data:c.precio.data, backgroundColor:c.precio.colores, borderWidth:0 }] },
        options:{ ...OPTS, cutout:'68%', plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:x => ' ' + x.label + ': ' + x.raw + ' props.' } } } }
      });
    }
    if (c.topLeadsChart) {
      const el = document.getElementById(id + '-leadsBarChart');
      if (el) new Chart(el, {
        type:'bar',
        data:{ labels:c.topLeadsChart.labels, datasets:[{ data:c.topLeadsChart.data, backgroundColor:c.topLeadsChart.colores, borderWidth:0, borderRadius:2 }] },
        options:{ ...OPTS, scales:axisOpts() }
      });
    }
    if (c.antiguedad) {
      const el = document.getElementById(id + '-oldChart');
      if (el) new Chart(el, {
        type:'bar', data:{ labels:c.antiguedad.labels, datasets:[{ data:c.antiguedad.data, backgroundColor:'rgba(231,56,56,0.35)', borderWidth:0, borderRadius:2 }] },
        options:{ ...OPTS, indexAxis:'y', scales:{
          x:{ ticks:{color:'#8C877E',font:{size:10}}, grid:{color:'#EAECEE'}, border:{display:false} },
          y:{ ticks:{color:'#8C877E',font:{size:9}}, grid:{display:false}, border:{display:false} } } }
      });
    }
  }

  if (tab === 'leads') {
    const l = r.leads;
    const el = document.getElementById(id + '-monthlyChart');
    if (el) new Chart(el, {
      type:'bar',
      data:{ labels:l.mensual.labels, datasets:[{ label:'Enquiries 2026', data:l.mensual.data, backgroundColor:'#AE9142', borderWidth:0, borderRadius:3 }] },
      options:{ ...OPTS, plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:x => ' ' + x.raw + ' enquiries' } } }, scales:axisOpts() }
    });
    donut(id + '-groupChart', l.groupPath.map(g => g.n), l.groupPath.map(g => g.leads), l.groupPath.map(g => g.color), 'leads');
    donut(id + '-mktChart', l.webPath.map(w => w.n), l.webPath.map(w => w.leads), l.webPath.map(w => w.color), 'leads');
  }

  if (tab === 'acciones' && r.acciones.paid) {
    const g = r.acciones.paid.google.chart;
    const el = document.getElementById(id + '-googleChart');
    if (el) new Chart(el, {
      type:'bar',
      data:{ labels:g.labels, datasets:[{ label:'Leads', data:g.data, backgroundColor:g.colores, borderWidth:0, borderRadius:2 }] },
      options:{ ...OPTS, plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:x => ' ' + x.raw + ' leads' } } }, scales:axisOpts() }
    });
  }
}

window.addEventListener('load', montar);
</script>
</body>
</html>
